spring.application.name=module4prod-ready-features
#logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

#For removing unnecessary thing from the console
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

#for connecting to MySql Database
spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=#Shayan@2004
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=9000
employeeService.base.url=http://localhost:8080/

#logging information
logging.level.com.shayancse.shayan.prod_ready_features.module4prod_ready_features.clients=TRACE
logging.level.com.shayancse.shayan.prod_ready_features.module4prod_ready_features.config=INFO
logging.pattern.console=%d{dd-mm-yyyy hh:MM:ss} [%level] [%c{1.}] --- %m%n
logging.file.name=application.log
logging.config=classpath:logback-spring.xml

#actuator configurations
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.name=Shayan Chakraborty
info.app.version=1.0.0
management.endpoint.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
